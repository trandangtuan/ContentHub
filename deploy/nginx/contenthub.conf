# ContentHub production nginx vhost.
#
# Single domain, two upstreams (matches docs/DEPLOYMENT.md's production
# architecture diagram): everything under /api/ goes to the Fastify API
# (apps/api, :4000); everything else goes to Next.js (apps/web, :3000).
# Same-origin means no CORS is needed between web and api in production —
# set NEXT_PUBLIC_API_URL="" (empty string) so apps/web's browser fetches
# hit relative /api/v1/... paths instead of a cross-origin URL.
#
# ⚠️ Replace before deploying:
#   - contenthub.example.com  → your real domain
#   - /etc/letsencrypt/live/contenthub.example.com/...  → your cert paths
#     (issue with: certbot --nginx -d contenthub.example.com)

upstream contenthub_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream contenthub_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name contenthub.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name contenthub.example.com;

    ssl_certificate     /etc/letsencrypt/live/contenthub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/contenthub.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/contenthub.access.log;
    error_log  /var/log/nginx/contenthub.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/atom+xml image/svg+xml;
    gzip_min_length 512;

    client_max_body_size 25M; # cover creator uploads (cover/avatar/chapter images — see packages/storage's per-purpose limits)

    # ── API (apps/api) ────────────────────────────────────────────────
    # docs/DEPLOYMENT.md: /api/** must never be cached at the edge/proxy —
    # it's auth-gated and carries session cookies.
    location /api/ {
        proxy_pass http://contenthub_api;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # ── Next.js build assets (content-hashed filenames → safe to cache forever) ──
    location /_next/static/ {
        proxy_pass http://contenthub_web;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Everything else (apps/web: public SSR pages, dashboard, admin) ──
    # Public pages (/truyen/**, /tac-gia/**, /the-loai/**, /tag/**) are
    # safe to cache at a CDN in front of this proxy; /dashboard/** and
    # /admin/** must not be — apps/web itself sends the right
    # Cache-Control per route (see docs/SEO.md, docs/DEPLOYMENT.md), so
    # this block just passes it through rather than overriding it.
    location / {
        proxy_pass http://contenthub_web;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev/HMR + any future websocket usage
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
